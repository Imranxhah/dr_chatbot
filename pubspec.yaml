name: dr_chatbot
description: AI-Powered Skin Disease Diagnosis Assistant
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests
  http: ^1.1.0

  # Color scheme and theming
  flex_color_scheme: ^8.3.0

  # Google Fonts for modern typography
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
# To add custom fonts:
# 1. Download fonts and place them in assets/fonts/
# 2. Uncomment and configure the section below
